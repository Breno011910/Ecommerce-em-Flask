{% extends "base.html" %}

{% block title %}
Cadastro
{% endblock %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-12 col-md-8 col-lg-5">

    <div class="card shadow-sm border-0">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h1 class="h3 fw-bold">
                    Criar cadastro
                </h1>

                <p class="text-muted mb-0">
                    Preencha seus dados para criar sua conta.
                </p>

            </div>


            <form method="POST">

                <div class="mb-3">

                    <label
                        for="nome"
                        class="form-label"
                    >
                        Nome
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label
                        for="senha"
                        class="form-label"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        required
                    >

                </div>


                <div class="d-grid">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Criar conta
                    </button>

                </div>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Já possui uma conta?
                </span>

                <a href="{{ url_for('login') }}">
                    Fazer login
                </a>

            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
