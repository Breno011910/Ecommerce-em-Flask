{% extends "base.html" %}

{% block title %}

{% if registro %}
    Editar Favorito
{% else %}
    Novo Favorito
{% endif %}

{% endblock %}

{% block content %}

<h1>

    {% if registro %}
        Editar Favorito
    {% else %}
        Novo Favorito
    {% endif %}

</h1>

<form method="POST">

    <label for="usuario_id">
        Usuário:
    </label>

    <select
        id="usuario_id"
        name="usuario_id"
        required
    >

        <option value="">
            Selecione um usuário
        </option>

        {% for usuario in usuarios %}

        <option
            value="{{ usuario.id }}"
            {% if registro and registro.usuario_id == usuario.id %}
                selected
            {% endif %}
        >
            {{ usuario.nome }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <label for="anuncio_id">
        Anúncio:
    </label>

    <select
        id="anuncio_id"
        name="anuncio_id"
        required
    >

        <option value="">
            Selecione um anúncio
        </option>

        {% for anuncio in anuncios %}

        <option
            value="{{ anuncio.id }}"
            {% if registro and registro.anuncio_id == anuncio.id %}
                selected
            {% endif %}
        >
            {{ anuncio.titulo }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">

        {% if registro %}
            Atualizar
        {% else %}
            Cadastrar
        {% endif %}

    </button>

    <a href="{{ url_for('favoritos') }}">
        Cancelar
    </a>

</form>

{% endblock %}
