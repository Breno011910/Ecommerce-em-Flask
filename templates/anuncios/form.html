{% extends "base.html" %}

{% block title %}

{% if registro %}
    Editar Anúncio
{% else %}
    Novo Anúncio
{% endif %}

{% endblock %}

{% block content %}

<h1>

    {% if registro %}
        Editar Anúncio
    {% else %}
        Novo Anúncio
    {% endif %}

</h1>

<form method="POST">

    <label for="titulo">
        Título:
    </label>

    <input
        type="text"
        id="titulo"
        name="titulo"
        value="{{ registro.titulo if registro else '' }}"
        required
    >

    <br><br>

    <label for="descricao">
        Descrição:
    </label>

    <textarea
        id="descricao"
        name="descricao"
        rows="4"
        required
    >{{ registro.descricao if registro else '' }}</textarea>

    <br><br>

    <label for="preco">
        Preço:
    </label>

    <input
        type="number"
        id="preco"
        name="preco"
        step="0.01"
        min="0"
        value="{{ registro.preco if registro else '' }}"
        required
    >

    <br><br>

    <label for="quantidade">
        Quantidade:
    </label>

    <input
        type="number"
        id="quantidade"
        name="quantidade"
        min="1"
        value="{{ registro.quantidade if registro else '1' }}"
        required
    >

    <br><br>

    <label for="status">
        Status:
    </label>

    <select id="status" name="status" required>

        <option value="Ativo"
            {% if registro and registro.status == "Ativo" %}
                selected
            {% endif %}>
            Ativo
        </option>

        <option value="Inativo"
            {% if registro and registro.status == "Inativo" %}
                selected
            {% endif %}>
            Inativo
        </option>

    </select>

    <br><br>

    <label for="usuario_id">
        Usuário:
    </label>

    <select id="usuario_id" name="usuario_id" required>

        <option value="">
            Selecione um usuário
        </option>

        {% for usuario in usuarios %}

        <option
            value="{{ usuario.id }}"
            {% if registro and registro.usuario_id == usuario.id %}
                selected
            {% endif %}
        >
            {{ usuario.nome }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <label for="categoria_id">
        Categoria:
    </label>

    <select id="categoria_id" name="categoria_id" required>

        <option value="">
            Selecione uma categoria
        </option>

        {% for categoria in categorias %}

        <option
            value="{{ categoria.id }}"
            {% if registro and registro.categoria_id == categoria.id %}
                selected
            {% endif %}
        >
            {{ categoria.nome }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">

        {% if registro %}
            Atualizar
        {% else %}
            Cadastrar
        {% endif %}

    </button>

    <a href="{{ url_for('anuncios') }}">
        Cancelar
    </a>

</form>

{% endblock %}
