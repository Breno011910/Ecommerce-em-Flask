{% extends "base.html" %}

{% block title %}
Responder pergunta
{% endblock %}


{% block content %}

<div class="formulario">

    <div class="mb-4">

        <h1>
            Responder pergunta
        </h1>

        <p class="text-muted mb-0">
            Responda à pergunta realizada sobre o anúncio.
        </p>

    </div>


    <div class="card bg-light border-0 mb-4">

        <div class="card-body">

            <p class="mb-2">

                <strong>Usuário:</strong>

                {{ registro.autor.nome }}

            </p>


            <p class="mb-2">

                <strong>Anúncio:</strong>

                {{ registro.anuncio.titulo }}

            </p>


            <p class="mb-0">

                <strong>Pergunta:</strong>

                {{ registro.texto }}

            </p>

        </div>

    </div>


    <form method="POST">

        <div class="mb-4">

            <label
                for="resposta"
                class="form-label">

                Resposta

            </label>

            <textarea
                class="form-control"
                id="resposta"
                name="resposta"
                rows="5"
                placeholder="Digite a resposta..."
                required>{{ registro.resposta or '' }}</textarea>

        </div>


        <div class="d-flex gap-2">

            <button
                type="submit"
                class="btn btn-success">

                Enviar resposta

            </button>


            <a
                href="{{ url_for('perguntas') }}"
                class="btn btn-outline-secondary">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
