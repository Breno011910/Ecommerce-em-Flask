{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-8 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <h1 class="h3 fw-bold">
                        Login
                    </h1>

                    <p class="text-muted mb-0">
                        Entre com seus dados para acessar o sistema.
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label
                            for="senha"
                            class="form-label"
                        >
                            Senha
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            required
                        >

                    </div>


                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Entrar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
